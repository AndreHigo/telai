name: Quality gates

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  static-and-build:
    name: Build, syntax and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm run build:frontend
      - name: JavaScript syntax
        run: |
          node --check server.mjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check public/admin/admin.js
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  api:
    name: API end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build:frontend
      - name: Run API suite
        run: pnpm run test:api
      - name: Run security rate-limit suite
        run: pnpm run test:security

  electron-and-web:
    name: Electron web and notification audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build:frontend
      # desktopCapturer requires a real X11 pixel buffer and hangs on the
      # headless Xvfb runner. The media suite remains a local/Windows gate.
      - name: Run web audit
        run: timeout --signal=TERM 300s xvfb-run -a pnpm run test:web-audit
      - name: Run notification suite
        run: timeout --signal=TERM 300s xvfb-run -a pnpm run test:notifications

  windows-installer:
    name: Windows installer smoke build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build:frontend
      - name: Build installer
        run: pnpm exec electron-builder --win nsis --publish never
      - name: Verify installer metadata
        shell: pwsh
        run: |
          $artifact = Get-ChildItem release -Filter 'Telai-Setup-*.exe' | Select-Object -First 1
          if (-not $artifact) { throw 'Instalador não foi gerado.' }
          if ($artifact.Length -lt 1MB) { throw 'Instalador gerado com tamanho inesperado.' }
          Get-FileHash $artifact.FullName -Algorithm SHA256
