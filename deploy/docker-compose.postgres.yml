services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TELAI_POSTGRES_DB:-telai}
      POSTGRES_USER: ${TELAI_POSTGRES_USER:-telai}
      POSTGRES_PASSWORD: ${TELAI_POSTGRES_PASSWORD:?configure TELAI_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${TELAI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - telai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  telai_postgres_data:
