services:
  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:?configure LIVEKIT_VERSION}
    command: ["--config", "/etc/livekit/livekit.yaml"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880/tcp"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_RTC_UDP_PORT_MIN:-50000}-${LIVEKIT_RTC_UDP_PORT_MAX:-50100}:${LIVEKIT_RTC_UDP_PORT_MIN:-50000}-${LIVEKIT_RTC_UDP_PORT_MAX:-50100}/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    networks:
      - telai-media

networks:
  telai-media:
